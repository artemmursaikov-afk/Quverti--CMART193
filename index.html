
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kugoo Night Rider</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d20;overflow:hidden;font-family:Arial}
canvas{width:100vw;height:100vh;display:block}
#hud{position:absolute;top:12px;left:12px;color:white;
background:#101a35e8;padding:12px;border-radius:12px}
#controls{position:absolute;bottom:20px;width:100%;
display:flex;justify-content:space-between;padding:0 18px}
button{padding:18px 25px;border-radius:16px;
background:#182b50;color:white;border:2px solid #9b64ff;
font-size:18px;touch-action:none}
</style>
</head>
<body>
<div id="hud">🛴 KUGOO NIGHT RIDER<br>
Скорость: <span id="speed">0</span> км/ч</div>
<div id="controls">
<button id="brake">ТОРМОЗ</button>
<button id="gas">ГАЗ ▶</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H,v=0,dist=0,rot=0,gas=false,brake=false;

function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}
onresize=resize;resize();

function button(id,fn){
 let b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();fn(true)};
 b.onpointerup=()=>fn(false);
 b.onpointerleave=()=>fn(false);
 b.onpointercancel=()=>fn(false);
}
button('gas',x=>gas=x);
button('brake',x=>brake=x);

onkeydown=e=>{
 if(e.key==='ArrowRight'||e.key==='d')gas=true;
 if(e.key==='ArrowLeft'||e.key==='a')brake=true;
};
onkeyup=e=>{
 if(e.key==='ArrowRight'||e.key==='d')gas=false;
 if(e.key==='ArrowLeft'||e.key==='a')brake=false;
};

function background(){
 let horizon=H*.57;
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#05091e');
 sky.addColorStop(1,'#27365d');
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Луна
 ctx.fillStyle='#fff0c5';
 ctx.beginPath();
 ctx.arc(W*.8,H*.14,25,0,7);
 ctx.fill();

 // Звёзды
 for(let i=0;i<80;i++){
 ctx.fillStyle='#ffffffaa';
 ctx.fillRect((i*137)%W,(i*71)%(horizon-20),2,2);
 }

 // Ночной город
 let offset=dist*.35%100;
 for(let x=-100;x<W+100;x+=100){
 let index=Math.floor((x+offset)/100);
 let h=100+Math.abs(Math.sin(index*8))*180;
 let bx=x-offset,by=horizon-h;
 ctx.fillStyle='#101b39';
 ctx.fillRect(bx,by,95,h);

 for(let yy=by+15;yy<horizon-10;yy+=25){
 for(let xx=bx+12;xx<bx+85;xx+=24){
 ctx.fillStyle='#ffdb7c';
 ctx.fillRect(xx,yy,9,12);
 }
 }
 }

 // Дорога
 ctx.fillStyle='#171b27';
 ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle='#77849a';
 ctx.fillRect(0,horizon,W,3);

 for(let x=-100;x<W+100;x+=120){
 ctx.fillStyle='#e5e7ec';
 ctx.fillRect(x-dist*1.5%120,horizon+(H-horizon)*.5,48,5);
 }
}

function wheel(x,y,r){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(rot);

 ctx.fillStyle='#090b10';
 ctx.beginPath();
 ctx.arc(0,0,r,0,7);
 ctx.fill();

 ctx.strokeStyle='#aeb8c9';
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.arc(0,0,r*.76,0,7);
 ctx.stroke();

 for(let i=0;i<8;i++){
 ctx.rotate(Math.PI/4);
 ctx.strokeStyle='#c9d1df';
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(0,0);
 ctx.lineTo(0,r*.75);
 ctx.stroke();
 }
 ctx.fillStyle='#ff9b27';
 ctx.beginPath();
 ctx.arc(0,0,6,0,7);
 ctx.fill();
 ctx.restore();
}

function scooter(){
 let s=Math.min(W/850,H/550,1);
 ctx.save();
 ctx.translate(W*.5,H*.72);
 ctx.scale(s,s);

 // Тень
 ctx.fillStyle='#0008';
 ctx.beginPath();
 ctx.ellipse(0,10,200,12,0,0,7);
 ctx.fill();

 // Колёса
 wheel(-135,0,39);
 wheel(140,0,39);

 // Заднее крыло
 ctx.strokeStyle='#202938';
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.arc(-135,0,43,Math.PI,Math.PI*1.85);
 ctx.stroke();

 // Дека
 ctx.fillStyle='#202735';
 ctx.beginPath();
 ctx.roundRect(-160,-39,335,17,6);
 ctx.fill();
 ctx.fillStyle='#ff9427';
 ctx.fillRect(-150,-20,300,4);

 // Оранжевый маятник
 ctx.strokeStyle='#ff9029';
 ctx.lineWidth=13;
 ctx.lineCap='round';
 ctx.beginPath();
 ctx.moveTo(-135,-3);
 ctx.lineTo(-90,-34);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(140,-3);
 ctx.lineTo(110,-34);
 ctx.stroke();

 // Передняя стойка
 ctx.strokeStyle='#929dad';
 ctx.lineWidth=13;
 ctx.beginPath();
 ctx.moveTo(140,-35);
 ctx.lineTo(92,-210);
 ctx.stroke();

 // Руль
 ctx.strokeStyle='#222b3b';
 ctx.lineWidth=13;
 ctx.beginPath();
 ctx.moveTo(42,-210);
 ctx.lineTo(142,-210);
 ctx.stroke();

 // Ручки
 ctx.strokeStyle='#111';
 ctx.lineWidth=12;
 ctx.beginPath();
 ctx.moveTo(40,-210);
 ctx.lineTo(22,-210);
 ctx.moveTo(142,-210);
 ctx.lineTo(165,-210);
 ctx.stroke();

 // Фара
 ctx.fillStyle='#fff3ad';
 ctx.shadowColor='#fff3ad';
 ctx.shadowBlur=25;
 ctx.beginPath();
 ctx.arc(105,-187,9,0,7);
 ctx.fill();
 ctx.shadowBlur=0;

 // Задний фонарь
 ctx.fillStyle='#ff294b';
 ctx.fillRect(-170,-39,12,10);

 // Подвеска
 ctx.strokeStyle='#c0c6d1';
 ctx.lineWidth=6;
 ctx.beginPath();
 ctx.moveTo(-120,-33);
 ctx.lineTo(-125,-8);
 ctx.stroke();

 ctx.restore();
}

function loop(){
 if(gas)v=Math.min(50,v+.12);
 else v=Math.max(0,v-.025);
 if(brake)v=Math.max(0,v-.5);

 dist+=v*.12;
 rot+=v*.012;

 document.getElementById('speed').textContent=Math.round(v);

 background();
 scooter();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
