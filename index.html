<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F3+ Scooter Simulator</title>
<style>
body {
  background:#111827;
  color:white;
  text-align:center;
  font-family:Arial;
  margin:0;
}
h1 {color:#36d9ff}
#speed {font-size:38px;color:#39ff91}
.scene {
  height:340px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#83c9f5 0 65%,#555 65%);
}
.ground {
  position:absolute;
  bottom:35px;
  height:8px;
  width:200%;
  background:repeating-linear-gradient(
    90deg,white 0 55px,transparent 55px 110px
  );
}
.scooter {
  position:absolute;
  width:320px;
  height:230px;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
}
.wheel {
  position:absolute;
  bottom:0;
  width:65px;
  height:65px;
  border:9px solid #151515;
  border-radius:50%;
  background:#777;
  box-sizing:border-box;
  box-shadow:inset 0 0 0 5px #bbb;
}
.front {right:15px}
.back {left:15px}
.deck {
  position:absolute;
  bottom:62px;
  left:45px;
  width:220px;
  height:17px;
  background:#222;
  border-radius:8px;
  border-bottom:5px solid #36d9ff;
}
.stem {
  position:absolute;
  bottom:75px;
  right:57px;
  width:12px;
  height:145px;
  background:#222;
  transform:rotate(-12deg);
  transform-origin:bottom;
  border-radius:5px;
}
.handle {
  position:absolute;
  top:0;
  right:22px;
  width:85px;
  height:10px;
  background:#111;
  border-radius:8px;
}
.light {
  position:absolute;
  bottom:74px;
  right:5px;
  width:18px;
  height:12px;
  background:#fff;
  box-shadow:0 0 15px white;
  border-radius:5px;
}
button {
  padding:20px 30px;
  border:0;
  border-radius:15px;
  color:white;
  font-size:20px;
  font-weight:bold;
  margin:10px;
}
#gas {background:#13a85a}
#brake {background:#d83232}
</style>
</head>
<body>

<h1>🛴 F3+ ELECTRIC</h1>
<div id="speed">0 км/ч</div>

<div class="scene">
  <div class="ground" id="ground"></div>

  <div class="scooter">
    <div class="wheel back" id="wheel1"></div>
    <div class="wheel front" id="wheel2"></div>
    <div class="deck"></div>
    <div class="stem"></div>
    <div class="handle"></div>
    <div class="light"></div>
  </div>
</div>

<button id="gas">⚡ ГАЗ</button>
<button id="brake">🛑 ТОРМОЗ</button>

<p id="status">Самокат стоит</p>
<p>Максимальная скорость: 60 км/ч</p>

<script>
let speed = 0;
let gas = false;
let brake = false;
let distance = 0;

const g = document.getElementById("gas");
const b = document.getElementById("brake");

g.onpointerdown = () => gas = true;
g.onpointerup = g.onpointerleave =
g.onpointercancel = () => gas = false;

b.onpointerdown = () => brake = true;
b.onpointerup = b.onpointerleave =
b.onpointercancel = () => brake = false;

function loop() {
  if(gas && !brake) speed += 0.15;
  else if(brake) speed -= 0.45;
  else speed -= 0.04;

  speed = Math.max(0,Math.min(60,speed));

  distance += speed * 0.12;

  document.getElementById("speed").textContent =
    Math.round(speed) + " км/ч";

  document.getElementById("ground").style.transform =
    `translateX(${-distance}px)`;

  document.getElementById("wheel1").style.transform =
    `rotate(${distance*4}deg)`;
  document.getElementById("wheel2").style.transform =
    `rotate(${distance*4}deg)`;

  document.getElementById("status").textContent =
    brake ? "Торможение 🛑" :
    speed > 0 ? "Едем вперёд ⚡" : "Стоим";

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
