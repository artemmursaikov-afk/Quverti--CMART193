<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kugoo Night Ride</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d20;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#hud{
 position:absolute;top:15px;left:15px;
 padding:12px 16px;border-radius:14px;
 color:white;background:#111b35dd;
 border:1px solid #657bb0;
 font-size:17px
}
#controls{
 position:absolute;bottom:22px;width:100%;
 display:flex;justify-content:space-between;
 padding:0 18px
}
button{
 padding:18px 25px;border-radius:18px;
 background:#192b50;color:white;
 border:2px solid #849bd0;
 font-size:18px;touch-action:none
}
</style>
</head>
<body>
<div id="hud">
 🛴 KUGOO NIGHT RIDE<br>
 Скорость: <span id="speed">0</span> км/ч
</div>
<canvas id="game"></canvas>
<div id="controls">
<button id="brake">ТОРМОЗ</button>
<button id="gas">ГАЗ ▶</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,speed=0,distance=0,angle=0;
let gas=false,brake=false;
let scooterReady=false;
let scooterImage=null;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

// ЗАГРУЗКА ТВОЕГО САМОКАТА
const photo=new Image();
photo.src="scooter.jpg";

const sprite=document.createElement("canvas");
sprite.width=620;
sprite.height=690;
const sc=sprite.getContext("2d");

photo.onload=()=>{
 sc.drawImage(photo,450,160,620,690,0,0,620,690);

 // Удаляем светлый фон фотографии
 const data=sc.getImageData(0,0,620,690);
 const p=data.data;

 for(let i=0;i<p.length;i+=4){
  const min=Math.min(p[i],p[i+1],p[i+2]);
  const max=Math.max(p[i],p[i+1],p[i+2]);

  if(min>205 && max-min<22){
   p[i+3]=Math.max(0,255-(min-205)*7);
  }
 }
 sc.putImageData(data,0,0);
 scooterReady=true;
};

// КНОПКИ
function control(id,fn){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();fn(true);
 });
 b.addEventListener("pointerup",()=>fn(false));
 b.addEventListener("pointercancel",()=>fn(false));
 b.addEventListener("pointerleave",()=>fn(false));
}
control("gas",v=>gas=v);
control("brake",v=>brake=v);

addEventListener("keydown",e=>{
 if(e.key==="ArrowRight"||e.key==="d")gas=true;
 if(e.key==="ArrowLeft"||e.key==="a")brake=true;
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowRight"||e.key==="d")gas=false;
 if(e.key==="ArrowLeft"||e.key==="a")brake=false;
});

// ГОРОД
function background(){
 const horizon=H*.57;

 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#050b20");
 sky.addColorStop(1,"#283454");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Луна
 ctx.fillStyle="#fff0bd";
 ctx.beginPath();
 ctx.arc(W*.78,H*.14,25,0,Math.PI*2);
 ctx.fill();

 // Звёзды
 for(let i=0;i<75;i++){
  let x=(i*139)%W;
  let y=(i*71)%(horizon-30);
  ctx.fillStyle="#ffffffaa";
  ctx.fillRect(x,y,2,2);
 }

 // Дома
 const bw=100;
 let offset=(distance*.35)%bw;

 for(let x=-bw;x<W+bw;x+=bw){
  let index=Math.floor((x+offset)/bw);
  let h=100+Math.abs(Math.sin(index*8.7))*190;
  let bx=x-offset;
  let by=horizon-h;

  ctx.fillStyle="#101a36";
  ctx.fillRect(bx,by,bw-5,h);

  for(let wy=by+15;wy<horizon-10;wy+=26){
   for(let wx=bx+12;wx<bx+bw-12;wx+=25){
    ctx.fillStyle=((Math.floor(wx+wy+index)%3)===0)
    ?"#eebf66":"#425779";
    ctx.fillRect(wx,wy,10,13);
   }
  }
 }

 // Дорога
 ctx.fillStyle="#171b28";
 ctx.fillRect(0,horizon,W,H-horizon);

 ctx.strokeStyle="#69738b";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(0,horizon);
 ctx.lineTo(W,horizon);
 ctx.stroke();

 // Разметка
 for(let x=-100;x<W+100;x+=110){
  let xx=x-(distance*1.8)%110;
  ctx.fillStyle="#d8dce8";
  ctx.fillRect(xx,horizon+(H-horizon)*.45,48,5);
 }

 // Дорожные огни
 for(let i=0;i<6;i++){
  let x=((i*210-distance*.8)%(W+210)+W+210)%(W+210);
  ctx.fillStyle="#252d43";
  ctx.fillRect(x,horizon-90,5,90);
  ctx.fillStyle="#ffdf8a";
  ctx.shadowColor="#ffdf8a";
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.arc(x+2,horizon-92,6,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }
}

// ВРАЩЕНИЕ КОЛЁС
function wheel(cx,cy,r){
 ctx.save();
 ctx.translate(cx,cy);
 ctx.rotate(angle);

 ctx.strokeStyle="#d4d9e5";
 ctx.lineWidth=3;

 for(let i=0;i<8;i++){
  ctx.rotate(Math.PI/4);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,r);
  ctx.stroke();
 }

 ctx.restore();
}

// САМОКАТ
function drawScooter(){
 const scale=Math.min(W*.88/620,H*.55/690);
 const w=620*scale;
 const h=690*scale;

 // Камера отдалена
 const x=(W-w)/2;
 const y=H*.39;

 if(scooterReady){
  ctx.drawImage(sprite,x,y,w,h);

  // Анимированные спицы поверх колёс
  wheel(x+110*scale,y+615*scale,39*scale);
  wheel(x+540*scale,y+615*scale,39*scale);
 }else{
  ctx.fillStyle="white";
  ctx.font="18px Arial";
  ctx.fillText("Загружаю Kugoo...",W/2-75,H*.7);
 }
}

function update(){
 if(gas)speed=Math.min(45,speed+.12);
 else speed=Math.max(0,speed-.035);

 if(brake)speed=Math.max(0,speed-.5);

 distance+=speed*.12;
 angle+=speed*.012;

 document.getElementById("speed").textContent=
 Math.round(speed);
}

function loop(){
 update();
 background();
 drawScooter();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
