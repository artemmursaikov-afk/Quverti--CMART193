<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KUGOO NIGHT RIDE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1d;overflow:hidden;font-family:Arial}
canvas{width:100vw;height:100vh;display:block}
#hud{
 position:absolute;top:12px;left:12px;color:white;
 background:#10192ddd;border:1px solid #ff922c;
 border-radius:12px;padding:12px;font-weight:bold;
 line-height:1.6
}
#shopBtn{
 position:absolute;top:12px;right:12px;
 background:#e98222;color:white;border:2px solid #ffc16d;
 border-radius:12px;padding:13px 18px;
 font-size:16px;font-weight:bold;max-width:150px;
}
#shop{
 display:none;position:absolute;inset:0;
 background:#050914ed;color:white;
 align-items:center;justify-content:center;padding:18px;
}
#shopPanel{
 width:100%;max-width:420px;
 background:#111c32;border:2px solid #ff922c;
 border-radius:20px;padding:22px;text-align:center;
}
#shopPanel h2{color:#ffad45;margin-top:0}
.product{
 background:#1c2b46;border:1px solid #53627c;
 border-radius:15px;padding:18px;margin:15px 0;
}
.product .scooterIcon{font-size:65px}
.product h3{margin:8px}
.product p{color:#ffd18b;font-weight:bold}
.shopAction{
 width:100%;padding:15px;border:0;border-radius:12px;
 background:#0c9b55;color:white;font-weight:bold;font-size:17px;
}
#closeShop{
 margin-top:12px;background:#b72b35;color:white;
 border:0;border-radius:12px;padding:12px 25px;font-weight:bold;
}
#controls{
 position:absolute;bottom:15px;width:100%;
 display:flex;justify-content:space-around;gap:12px;padding:0 12px
}
#controls button{
 flex:1;max-width:230px;padding:18px 8px;
 border:2px solid #ffffff55;border-radius:18px;
 color:white;font-size:19px;font-weight:bold;touch-action:none
}
#gas{background:#0c9b55}
#brake{background:#c92b32}
</style>
</head>
<body>

<div id="hud">
🛴 <span id="modelName">KUGOO NIGHT RIDE</span><br>
Скорость: <span id="speed">0</span> км/ч<br>
💵 Деньги: $<span id="money">0</span>
</div>

<button id="shopBtn" onclick="openShop()">🛒 МАГАЗИН</button>

<div id="shop">
 <div id="shopPanel">
  <h2>🛒 МАГАЗИН САМОКАТОВ</h2>
  <div>Твой баланс: <b style="color:#ffc16d">$<span id="shopMoney">0</span></b></div>

  <div class="product">
   <div class="scooterIcon">🛴</div>
   <h3>Kugoo M5 Pro</h3>
   <p>Цена: $2000</p>
   <div id="productStatus">Мощный городской самокат!</div>
   <br>
   <button class="shopAction" id="buyBtn" onclick="buyScooter()">
    КУПИТЬ ЗА $2000
   </button>
  </div>

  <button id="closeShop" onclick="closeShop()">ЗАКРЫТЬ</button>
 </div>
</div>

<canvas id="game"></canvas>

<div id="controls">
<button id="brake">ТОРМОЗ</button>
<button id="gas">⚡ ГАЗ</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let W,H,v=0,road=0,rotation=0,gas=false,brake=false;

let money=Number(localStorage.getItem("kugooMoney"))||0;
let owned=localStorage.getItem("m5proOwned")==="true";
let selected=localStorage.getItem("selectedScooter")||"KUGOO NIGHT RIDE";

function saveGame(){
 localStorage.setItem("kugooMoney",money);
 localStorage.setItem("m5proOwned",owned);
 localStorage.setItem("selectedScooter",selected);
}

function updateMoney(){
 document.getElementById("money").textContent=Math.floor(money);
 document.getElementById("shopMoney").textContent=Math.floor(money);
 document.getElementById("modelName").textContent=selected;
}

function openShop(){
 updateShop();
 document.getElementById("shop").style.display="flex";
}

function closeShop(){
 document.getElementById("shop").style.display="none";
}

function updateShop(){
 updateMoney();
 const btn=document.getElementById("buyBtn");
 const status=document.getElementById("productStatus");

 if(!owned){
  btn.textContent=money>=2000?"КУПИТЬ ЗА $2000":"НЕДОСТАТОЧНО ДЕНЕГ";
  btn.disabled=money<2000;
  btn.style.opacity=money<2000?".5":"1";
  status.textContent="Мощный городской самокат!";
 }else{
  btn.disabled=false;
  btn.style.opacity="1";
  btn.textContent=selected==="KUGOO M5 PRO"?"ВЫБРАН":"ВЫБРАТЬ САМОКАТ";
  status.textContent="✅ Самокат куплен!";
 }
}

function buyScooter(){
 if(!owned){
  if(money<2000)return;
  money-=2000;
  owned=true;
  selected="KUGOO M5 PRO";
  saveGame();
 }else{
  selected="KUGOO M5 PRO";
  saveGame();
 }
 updateShop();
}

function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function hold(id,fn){
 const b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();fn(true)};
 ["pointerup","pointercancel","pointerleave"].forEach(
  ev=>b.addEventListener(ev,()=>fn(false))
 );
}
hold("gas",x=>gas=x);
hold("brake",x=>brake=x);

onkeydown=e=>{
 if(e.key==="ArrowRight"||e.key==="d")gas=true;
 if(e.key==="ArrowLeft"||e.key==="a")brake=true;
};
onkeyup=e=>{
 if(e.key==="ArrowRight"||e.key==="d")gas=false;
 if(e.key==="ArrowLeft"||e.key==="a")brake=false;
};

function line(x,y,x2,y2,color,w){
 ctx.strokeStyle=color;ctx.lineWidth=w;
 ctx.lineCap="round";ctx.beginPath();
 ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
}

function box(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function city(){
 let horizon=H*.55;
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,"#03081b");
 sky.addColorStop(1,"#334767");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 ctx.fillStyle="#fff0c2";
 ctx.shadowColor="#fff0c2";ctx.shadowBlur=20;
 ctx.beginPath();ctx.arc(W*.8,H*.13,24,0,7);ctx.fill();
 ctx.shadowBlur=0;

 for(let i=0;i<70;i++){
  ctx.fillStyle="#ffffff99";
  ctx.fillRect(i*139%W,i*71%(horizon-25),2,2);
 }

 let offset=road*.3%105;
 for(let x=-105;x<W+105;x+=105){
  let n=Math.floor((x+offset)/105);
  let h=100+Math.abs(Math.sin(n*8.3))*190;
  let bx=x-offset,by=horizon-h;
  ctx.fillStyle="#101a35";
  ctx.fillRect(bx,by,100,h);
  for(let yy=by+17;yy<horizon-10;yy+=27){
   for(let xx=bx+12;xx<bx+90;xx+=25){
    ctx.fillStyle=((Math.floor(xx+yy+n)%4)===0)
      ?"#ffcf75":"#425779";
    ctx.fillRect(xx,yy,10,13);
   }
  }
 }

 ctx.fillStyle="#22252d";
 ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle="#8793a6";
 ctx.fillRect(0,horizon,W,3);

 for(let x=-100;x<W+100;x+=120){
  ctx.fillStyle="white";
  ctx.fillRect(x-road*1.5%120,
  horizon+(H-horizon)*.52,52,5);
 }

 for(let i=0;i<5;i++){
  let x=((i*230-road*.6)%(W+230)+W+230)%(W+230);
  line(x,horizon-5,x,horizon-115,"#252f45",5);
  ctx.fillStyle="#ffe1a0";
  ctx.shadowColor="#ffdc8b";ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(x,horizon-116,7,0,7);ctx.fill();
  ctx.shadowBlur=0;
 }
}

function wheel(x,y,r){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#080a0d";
 ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();

 ctx.strokeStyle="#454b53";ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(0,0,r-4,0,7);ctx.stroke();

 ctx.strokeStyle="#c6cbd2";ctx.lineWidth=5;
 ctx.beginPath();ctx.arc(0,0,r*.69,0,7);ctx.stroke();

 ctx.save();ctx.rotate(rotation);
 for(let i=0;i<10;i++){
  ctx.rotate(Math.PI/5);
  line(0,0,0,r*.67,"#b7c0ca",3);
 }
 ctx.restore();

 ctx.fillStyle="#ff9028";
 ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
 box(r*.43,-r*.38,13,17,4,"#c83e35");
 ctx.restore();
}

function scooter(){
 let s=Math.min(W/950,H/690,1.05);
 ctx.save();
 ctx.translate(W*.5,H*.75);
 ctx.scale(s,s);

 ctx.fillStyle="#08090c99";
 ctx.beginPath();ctx.ellipse(0,12,325,15,0,0,7);ctx.fill();

 ctx.strokeStyle="#171d27";ctx.lineWidth=14;
 ctx.beginPath();ctx.arc(-245,-2,65,Math.PI,Math.PI*1.88);ctx.stroke();
 ctx.beginPath();ctx.arc(235,-2,65,Math.PI,Math.PI*1.88);ctx.stroke();

 wheel(-245,0,59);
 wheel(235,0,59);

 line(-245,-5,-155,-69,"#f28a25",19);
 line(-245,-5,-155,-69,"#ffb04b",4);
 line(235,-5,170,-69,"#f28a25",19);
 line(235,-5,170,-69,"#ffb04b",4);

 line(-174,-58,-183,-12,"#aab2bd",7);
 line(-180,-58,-188,-12,"#e3e6eb",2);
 line(188,-58,201,-12,"#aab2bd",7);
 line(194,-58,207,-12,"#e3e6eb",2);

 box(-205,-91,410,29,9,"#242b36");
 box(-197,-96,394,7,3,"#68717e");
 line(-193,-61,190,-61,"#ff8e28",4);

 for(let x=-150;x<150;x+=17){
  ctx.fillStyle="#f18b27";
  ctx.beginPath();
  ctx.moveTo(x,-86);ctx.lineTo(x+9,-86);
  ctx.lineTo(x+4,-79);ctx.lineTo(x-5,-79);
  ctx.fill();
 }

 box(-220,-109,58,27,7,"#303844");
 box(150,-111,65,36,8,"#252c38");

 ctx.save();
 ctx.translate(175,-100);
 ctx.rotate(-.20);
 box(-17,-340,34,265,8,"#242b36");
 box(-9,-320,5,235,2,"#ff922c");

 ctx.save();
 ctx.translate(5,-175);
 ctx.rotate(-Math.PI/2);
 ctx.fillStyle="#ff922d";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.fillText(selected==="KUGOO M5 PRO"?"M5 PRO":"KUGOO",0,0);
 ctx.restore();
 ctx.restore();

 ctx.fillStyle="#343d49";
 ctx.beginPath();
 ctx.moveTo(140,-95);ctx.lineTo(205,-95);
 ctx.lineTo(188,-147);ctx.lineTo(162,-165);
 ctx.closePath();ctx.fill();

 line(133,-440,242,-440,"#181d26",13);
 line(121,-440,137,-440,"#9ba4b1",8);
 line(238,-440,255,-440,"#9ba4b1",8);

 box(163,-462,47,25,7,"#303946");
 box(171,-458,29,8,3,"#ff9a35");

 line(242,-440,260,-421,"#aab2bf",4);

 ctx.fillStyle="#ff9a36";
 ctx.shadowColor="#ff982d";ctx.shadowBlur=22;
 ctx.beginPath();ctx.arc(177,-406,12,0,7);ctx.fill();
 ctx.shadowBlur=0;

 line(-10,-66,-20,4,"#171c25",8);
 line(-31,4,-12,4,"#171c25",5);

 ctx.fillStyle="#ff2948";
 ctx.shadowColor="#ff2948";ctx.shadowBlur=14;
 ctx.fillRect(-175,-94,13,9);
 ctx.shadowBlur=0;

 ctx.restore();
}

let lastTime=performance.now();

function loop(now){
 let dt=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 if(gas)v=Math.min(60,v+9*dt);
 else v=Math.max(0,v-1.5*dt);
 if(brake)v=Math.max(0,v-33*dt);

 if(v>1){
  money+=5*dt;
  saveGame();
  updateMoney();
 }

 road+=v*.12;
 rotation+=v*.012;

 document.getElementById("speed").textContent=Math.round(v);
 city();
 scooter();
 requestAnimationFrame(loop);
}

updateMoney();
updateShop();
loop(performance.now());
</script>
</body>
</html>
