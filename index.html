<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KUGOO NIGHT RIDE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1d;overflow:hidden;font-family:Arial,sans-serif}
canvas{width:100vw;height:100vh;display:block}
#hud{
 position:absolute;top:12px;left:12px;color:white;
 background:#10192ddd;border:1px solid #ff922c;
 border-radius:12px;padding:12px;font-weight:bold;line-height:1.6
}
#shopBtn{
 position:absolute;top:12px;right:12px;background:#e98222;
 color:white;border:2px solid #ffc16d;border-radius:12px;
 padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer
}
#shop{
 display:none;position:absolute;inset:0;background:#050914ed;
 color:white;align-items:center;justify-content:center;padding:18px;z-index:10
}
#shopPanel{
 width:100%;max-width:420px;background:#111c32;
 border:2px solid #ff922c;border-radius:20px;padding:22px;text-align:center
}
#shopPanel h2{color:#ffad45;margin-top:0}
.product{
 background:#1c2b46;border:1px solid #53627c;
 border-radius:15px;padding:18px;margin:15px 0
}
.scooterIcon{font-size:65px}
.product h3{margin:8px}
.product p{color:#ffd18b;font-weight:bold}
.shopAction{
 width:100%;padding:15px;border:0;border-radius:12px;
 background:#0c9b55;color:white;font-weight:bold;font-size:17px;cursor:pointer
}
#closeShop{
 margin-top:12px;background:#b72b35;color:white;
 border:0;border-radius:12px;padding:12px 25px;font-weight:bold;cursor:pointer
}
#controls{
 position:absolute;bottom:15px;width:100%;
 display:flex;justify-content:space-around;gap:8px;padding:0 10px
}
#controls button{
 flex:1;max-width:230px;padding:17px 5px;
 border:2px solid #ffffff55;border-radius:18px;
 color:white;font-size:16px;font-weight:bold;touch-action:none;cursor:pointer
}
#gas{background:#0c9b55}
#brake{background:#c92b32}
#stunt{background:#8b36c9}
</style>
</head>
<body>

<div id="hud">
🛴 <span id="modelName">KUGOO NIGHT RIDE</span><br>
Скорость: <span id="speed">0</span> км/ч<br>
💵 Деньги: $<span id="money">0</span>
</div>

<button id="shopBtn" onclick="openShop()">🛒 МАГАЗИН</button>

<div id="shop">
 <div id="shopPanel">
  <h2>🛒 МАГАЗИН САМОКАТОВ</h2>
  <div>Твой баланс: <b style="color:#ffc16d">$<span id="shopMoney">0</span></b></div>
  <div class="product">
   <div class="scooterIcon">🛵</div>
   <h3>Kugoo M5 Pro</h3>
   <p>Цена: $2000</p>
   <div id="productStatus">С сиденьем, кофром и макс. скоростью 85 км/ч!</div>
   <br>
   <button class="shopAction" id="buyBtn" onclick="buyScooter()">КУПИТЬ ЗА $2000</button>
  </div>
  <button id="closeShop" onclick="closeShop()">ЗАКРЫТЬ</button>
 </div>
</div>

<canvas id="game"></canvas>

<div id="controls">
 <button id="brake">🛑 ТОРМОЗ</button>
 <button id="stunt">🔥 СТАНТ</button>
 <button id="gas">⚡ ГАЗ</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let W,H,v=0,road=0,rotation=0;
let gas=false,brake=false,stunt=false;
let stuntAngle=0;
let money=Number(localStorage.getItem("kugooMoney"))||0;
let owned=localStorage.getItem("m5proOwned")==="true";
let selected=localStorage.getItem("selectedScooter")||"KUGOO NIGHT RIDE";

function saveGame(){
 localStorage.setItem("kugooMoney",money);
 localStorage.setItem("m5proOwned",owned);
 localStorage.setItem("selectedScooter",selected);
}
function updateMoney(){
 document.getElementById("money").textContent=Math.floor(money);
 document.getElementById("shopMoney").textContent=Math.floor(money);
 document.getElementById("modelName").textContent=selected;
}
function openShop(){
 updateShop();
 document.getElementById("shop").style.display="flex";
}
function closeShop(){
 document.getElementById("shop").style.display="none";
}
function updateShop(){
 updateMoney();
 const btn=document.getElementById("buyBtn");
 const status=document.getElementById("productStatus");
 if(!owned){
  btn.textContent=money>=2000?"КУПИТЬ ЗА $2000":"НЕДОСТАТОЧНО ДЕНЕГ";
  btn.disabled=money<2000;
  btn.style.opacity=money<2000?".5":"1";
  status.textContent="С сиденьем, кофром и макс. скоростью 85 км/ч!";
 }else{
  btn.disabled=false;
  btn.style.opacity="1";
  btn.textContent=selected==="KUGOO M5 PRO"?"ПЕРЕКЛЮЧИТЬ НА ОБЫЧНЫЙ":"ВЫБРАТЬ M5 PRO";
  status.textContent="✅ Самокат куплен! Выбрано: "+selected;
 }
}
function buyScooter(){
 if(!owned){
  if(money<2000)return;
  money-=2000;
  owned=true;
  selected="KUGOO M5 PRO";
 }else{
  selected=selected==="KUGOO M5 PRO"?"KUGOO NIGHT RIDE":"KUGOO M5 PRO";
 }
 saveGame();
 updateShop();
}

function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}
addEventListener("resize",resize);
resize();

function hold(id,fn){
 const b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();fn(true)};
 ["pointerup","pointercancel","pointerleave"].forEach(
  ev=>b.addEventListener(ev,()=>fn(false))
 );
}
hold("gas",x=>gas=x);
hold("brake",x=>brake=x);
hold("stunt",x=>stunt=x);

onkeydown=e=>{
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"||e.key==="в"||e.key==="В")gas=true;
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"||e.key==="ф"||e.key==="Ф")brake=true;
 if(e.key===" ")stunt=true;
};
onkeyup=e=>{
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"||e.key==="в"||e.key==="В")gas=false;
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"||e.key==="ф"||e.key==="Ф")brake=false;
 if(e.key===" ")stunt=false;
};

function line(x,y,x2,y2,color,w){
 ctx.strokeStyle=color;ctx.lineWidth=w;
 ctx.lineCap="round";ctx.beginPath();
 ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
}
function box(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function city(){
 let horizon=H*.55;
 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,"#03081b");
 sky.addColorStop(1,"#334767");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 ctx.fillStyle="#fff0c2";
 ctx.shadowColor="#fff0c2";ctx.shadowBlur=20;
 ctx.beginPath();ctx.arc(W*.8,H*.13,24,0,7);ctx.fill();
 ctx.shadowBlur=0;

 for(let i=0;i<70;i++){
  ctx.fillStyle="#ffffff99";
  ctx.fillRect(i*139%W,i*71%(horizon-25),2,2);
 }

 let offset=road*.3%105;
 for(let x=-105;x<W+105;x+=105){
  let n=Math.floor((x+offset)/105);
  let h=100+Math.abs(Math.sin(n*8.3))*190;
  let bx=x-offset,by=horizon-h;
  ctx.fillStyle="#101a35";
  ctx.fillRect(bx,by,100,h);
  for(let yy=by+17;yy<horizon-10;yy+=27){
   for(let xx=bx+12;xx<bx+90;xx+=25){
    ctx.fillStyle=((Math.floor(xx+yy+n)%4)===0)
      ?"#ffcf75":"#425779";
    ctx.fillRect(xx,yy,10,13);
   }
  }
 }

 ctx.fillStyle="#22252d";
 ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle="#8793a6";
 ctx.fillRect(0,horizon,W,3);

 for(let x=-100;x<W+100;x+=120){
  ctx.fillStyle="white";
  ctx.fillRect(x-road*1.5%120,horizon+(H-horizon)*.52,52,5);
 }

 for(let i=0;i<5;i++){
  let x=((i*230-road*.6)%(W+230)+W+230)%(W+230);
  line(x,horizon-5,x,horizon-115,"#252f45",5);
  ctx.fillStyle="#ffe1a0";
  ctx.shadowColor="#ffdc8b";ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(x,horizon-116,7,0,7);ctx.fill();
  ctx.shadowBlur=0;
 }
}

function wheel(x,y,r,accentColor){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#080a0d";
 ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
 ctx.strokeStyle="#454b53";ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(0,0,r-4,0,7);ctx.stroke();
 ctx.strokeStyle="#c6cbd2";ctx.lineWidth=5;
 ctx.beginPath();ctx.arc(0,0,r*.69,0,7);ctx.stroke();

 ctx.save();ctx.rotate(rotation);
 for(let i=0;i<10;i++){
  ctx.rotate(Math.PI/5);
  line(0,0,0,r*.67,"#b7c0ca",3);
 }
 ctx.restore();

 ctx.fillStyle=accentColor;
 ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
 box(r*.43,-r*.38,13,17,4,"#c83e35");
 ctx.restore();
}

function scooter(){
 const isM5 = selected === "KUGOO M5 PRO";
 const mainAccent = isM5 ? "#e63946" : "#f28a25";
 const brightAccent = isM5 ? "#ff6b6b" : "#ff922c";

 let s=Math.min(W/950,H/690,1.05);
 ctx.save();
 ctx.translate(W*.5,H*.75);

 ctx.rotate(-stuntAngle);
 ctx.scale(s,s);

 // Тень
 ctx.fillStyle="#08090c99";
 ctx.beginPath();ctx.ellipse(0,12,330,15,0,0,7);ctx.fill();

 // Крылья (у M5 Pro более массивные)
 ctx.strokeStyle=isM5?"#1f2633":"#171d27";
 ctx.lineWidth=isM5?18:14;
 ctx.beginPath();ctx.arc(-245,-2,66,Math.PI,Math.PI*1.92);ctx.stroke();
 ctx.beginPath();ctx.arc(235,-2,66,Math.PI,Math.PI*1.92);ctx.stroke();

 // Колёса (не трогаем геометрию, меняем только цвет ступицы под стиль модели)
 wheel(-245,0,59,mainAccent);
 wheel(235,0,59,mainAccent);

 // Рычаги подвески
 line(-245,-5,-155,-69,mainAccent,isM5?22:19);
 line(-245,-5,-155,-69,brightAccent,4);
 line(235,-5,170,-69,mainAccent,isM5?22:19);
 line(235,-5,170,-69,brightAccent,4);

 // Амортизаторы
 line(-174,-58,-183,-12,"#aab2bd",isM5?9:7);
 line(-180,-58,-188,-12,"#e3e6eb",2);
 line(188,-58,201,-12,"#aab2bd",isM5?9:7);
 line(194,-58,207,-12,"#e3e6eb",2);

 // Если M5 Pro — добавляем переднюю двойную вилку и пружины
 if(isM5){
  line(175,-65,222,-5,"#2b3340",10);
  line(185,-55,212,-18,mainAccent,6);
  // Задние двойные амортизаторы
  line(-160,-65,-215,-12,"#2b3340",9);
  line(-172,-55,-204,-20,mainAccent,5);
 }

 // Дека (у M5 Pro более толстая и мощная батарея)
 if(isM5){
  box(-215,-98,430,36,10,"#1b212c");
  box(-205,-103,410,8,4,"#4f5866");
  line(-200,-62,200,-62,brightAccent,5);
 }else{
  box(-205,-91,410,29,9,"#242b36");
  box(-197,-96,394,7,3,"#68717e");
  line(-193,-61,190,-61,"#ff8e28",4);
 }

 // Полоски на деке
 for(let x=-150;x<150;x+=17){
  ctx.fillStyle=mainAccent;
  ctx.beginPath();
  ctx.moveTo(x,isM5?-93:-86);ctx.lineTo(x+9,isM5?-93:-86);
  ctx.lineTo(x+4,isM5?-86:-79);ctx.lineTo(x-5,isM5?-86:-79);
  ctx.fill();
 }

 // Сиденье и задний кофр для KUGOO M5 PRO
 if(isM5){
  // Подседельный штырь с амортизатором
  line(-95,-98,-115,-225,"#2a323f",14);
  line(-100,-135,-110,-185,mainAccent,8);
  // Багажник и кофр сзади
  line(-120,-185,-225,-185,"#1a202b",8);
  line(-175,-98,-205,-185,"#1a202b",7);
  box(-245,-255,78,68,12,"#181e29");
  box(-245,-232,78,8,2,mainAccent);
